name: metadoc

services:
  server:
    build:
      context: .
    ports:
      - 9000:80
    depends_on:
      db:
        condition: service_started
    environment:
      - DB_PASS=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
    develop:
      watch:
        - action: sync
          path: ./public
          target: /var/www/html
    volumes:
      - ./public/imgs/Portadas:/var/www/html/imgs/Portadas

  db:
    container_name: metadoc-db
    image: mysql:9.7
    restart: always
    volumes:
      - mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    expose:
      - 3306
  
  # OPTIONAL: Simple database managment
  # adminer:
  #   image: adminer
  #   restart: unless-stopped
  #   ports:
  #     - 8085:8080
  #   depends_on:
  #     - db

volumes:
  mysql:
